<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda 3V - Registro</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
  <!-- Encabezado -->
  <header>
  <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg navbar-tienda sticky-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img
                    src="../img/logo.png"
                    alt="Logo Tienda 3V"
                    class="logo">
                    
                <span>Tienda 3V</span>
            </a>

            <!-- Botón hamburguesa para móvil -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido del menú -->
            <div
                class="collapse navbar-collapse"
                id="menuPrincipal">
                <!-- Links -->
                <ul class="navbar-nav ms-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="#">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="#categorias">
                            Categorías
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="#acerca">
                            Acerca
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="#contacto">
                            Contacto
                        </a>
                    </li>
                </ul>

                <!-- Buscador -->
                <form
                    class="search-box ms-lg-auto"
                    role="search">

                    <i class="bi bi-search"></i>
                    <input
                        type="search"
                        placeholder="Busca abarrotes, lácteos, limpieza y más..."
                        aria-label="Buscar productos">
                </form>

                <!-- Iconos -->
                <div class="nav-actions">
                    <!-- Usuario -->
                    <button
                        class="icon-button"
                        aria-label="Mi cuenta">
                        <i class="bi bi-person"></i>
                    </button>

                    <!-- Carrito -->
                    <button
                        class="cart-button"
                        aria-label="Carrito">
                        <i class="bi bi-cart3"></i>

                        <span class="cart-count">6</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>

  <!-- Formulario de registro -->
  <main>
    <section class="form-container">
      <h2>Formulario de Registro</h2>
      <form>
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" placeholder="Ej. Juan" required>

        <label for="apellido">Apellido(s)</label>
        <input type="text" id="apellido" placeholder="Ej. Pérez" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej. 5512345678" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Min. 8 caracteres" required>

        <label for="confirmar">Confirmar Contraseña</label>
        <input type="password" id="confirmar" placeholder="Repite contraseña" required>

        <label>
          <input type="checkbox" required> Acepto los términos de servicio y condiciones
        </label>

        <button type="submit">Crear cuenta</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
    <footer id="contacto">
        <div class="container text-center">
            <p class="mb-0">
                © 2026 Tienda 3V.
                Todos los derechos reservados.
            </p>
        </div>
    </footer>
 <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</body>
</html>
