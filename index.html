<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda 3V - Inicio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/global.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg navbar-tienda sticky-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img
                    src="img/Logo.png"
                    alt="Logo Tienda 3V"
                    class="logo">
                    
                <span>Tienda 3V</span>
            </a>

            <!-- Botón hamburguesa para móvil -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido del menú -->
            <div
                class="collapse navbar-collapse"
                id="menuPrincipal">
                <!-- Links -->
                <ul class="navbar-nav ms-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="pages/categorias.html">
                            Categorías
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="pages/acerca.html">
                            Acerca
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="pages/contacto.html">
                            Contacto
                        </a>
                    </li>
                </ul>

                <!-- Buscador -->
                <form
                    class="search-box ms-lg-auto"
                    role="search">

                    <i class="bi bi-search"></i>
                    <input
                        type="search"
                        placeholder="Busca abarrotes, lácteos, limpieza y más..."
                        aria-label="Buscar productos">
                </form>

                <!-- Iconos -->
                <div class="nav-actions">
                    <!-- Usuario -->
                    <button
                        class="icon-button"
                        aria-label="Mi cuenta">
                        <i class="bi bi-person"></i>
                    </button>

                    <!-- Carrito -->
                    <button
                        class="cart-button"
                        aria-label="Carrito">
                        <i class="bi bi-cart3"></i>

                        <span class="cart-count">6</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center py-5">
        <h1 class="display-4 fw-bold mb-4" style="color: var(--primary);">Bienvenido a Tienda 3V</h1>
        <p class="lead mb-5">Encuentra los mejores productos a los mejores precios.</p>
        <div class="d-flex gap-3">
            <a href="pages/categorias.html" class="btn btn-primary btn-lg px-4">Ver Categorías</a>
            <a href="pages/contacto.html" class="btn btn-outline-primary btn-lg px-4">Contáctanos</a>
        </div>
    </main>

    <footer class="footer-contacto" id="contacto">
    <div class="container">
        <div class="footer-content">

            <!-- Teléfono -->
            <div class="footer-item">
                <i class="bi bi-telephone-fill"></i>
                <span>Llámanos: 800-3V-AYUDA (800-382-9832)</span>
            </div>

            <!-- Correo -->
            <div class="footer-item">
                <i class="bi bi-envelope-fill"></i>
                <span>contacto@tienda3v.mx</span>
            </div>

        </div>
    </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/global.js"></script>
</body>

</html>
