<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Tienda 3V</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
    <div id="navbar-container"></div>
    <div class="container py-5" style="flex: 1;">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-4 shadow">
                    <h2 class="text-center mb-4">Nueva Contraseña</h2>
                    <div id="mensaje"></div>
                    <p class="text-muted small mb-3" id="correoMostrado"></p>
                    
                    <label class="form-label">Nueva contraseña:</label>
                    <input type="password" id="nueva" class="form-control mb-2" placeholder="Min. 8 caracteres">
                    
                    <label class="form-label">Confirmar contraseña:</label>
                    <input type="password" id="confirmar" class="form-control mb-3" placeholder="Repite la contraseña">
                    
                    <button id="btnGuardar" class="btn btn-primary w-100">Guardar contraseña</button>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/restablecer.js"></script>
</body>
</html>
