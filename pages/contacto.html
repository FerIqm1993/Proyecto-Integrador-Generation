<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda 3V - Contacto y Soporte</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/global.css" rel="stylesheet">
    <link href="../css/contacto.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
      <!-- Aquí se inserta el navbar desde el archivo navbar.html -->
    <div id="navbar-container"></div>

    <!-- Seccion Principal -->
    <header class="seccion-principal text-white py-2 py-lg-5">
        <div class="container">
            <h1 class="fw-bold mb-2 titulo-principal">Contáctanos</h1>
            <p class="mb-0 fs-5 text-white-50 d-none d-lg-block">Estamos aquí para resolver cualquier duda o sugerencia sobre tus pedidos.</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-4 my-lg-5 flex-grow-1">
        <div class="row g-4">

            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 h-100 p-lg-2 tarjeta-contacto-movil">
                    <div class="card-body p-4 p-md-4">
                        <h4 class="fw-bold mb-4">Envíanos un mensaje</h4>
                        <form id="formularioContacto" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small text-dark">Nombre completo</label>
                                    <input type="text" class="form-control input-personalizado" id="nombre" name="de_nombre" placeholder="Juan Escutia" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small text-dark">Correo electrónico</label>
                                    <input type="email" class="form-control input-personalizado" id="correo" name="correo_usuario" placeholder="juan@gmail.com" required>
                                </div>
                                <div class="col-md-6 mt-3 mt-lg-4">
                                    <label class="form-label small text-dark">Teléfono</label>
                                    <input type="tel" class="form-control input-personalizado" id="telefono" name="telefono" placeholder="5555555555">
                                </div>
                                <div class="col-md-6 mt-3 mt-lg-4">
                                    <label class="form-label small text-dark">Motivo de consulta</label>
                                    <select class="form-select input-personalizado" id="asunto" name="asunto" required>
                                        <option value="Soporte técnico / Compra en línea" selected>Soporte técnico / Compra en línea</option>
                                        <option value="Duda sobre pedido">Duda sobre pedido</option>
                                        <option value="Facturación">Facturación</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-3 mt-lg-4">
                                    <label class="form-label small text-dark">Mensaje</label>
                                    <textarea class="form-control input-personalizado" id="mensaje" name="mensaje" rows="3" placeholder="Escribe tu mensaje aquí..." required></textarea>
                                </div>
                                <div class="col-12 mt-3">
                                    <div class="form-check d-flex align-items-center">
                                        <input class="form-check-input me-2 mt-0 checkbox-personalizado" type="checkbox" id="politicaPrivacidad" required checked>
                                        <label class="form-check-label small text-dark etiqueta-privacidad" for="politicaPrivacidad">
                                            Acepto el Aviso de Privacidad Integral.
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary w-100 py-2 py-lg-3 fw-bold rounded-3 fs-6">Enviar mensaje</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Info y Mapa -->
            <div class="col-lg-5 d-none d-lg-flex flex-column gap-4">
                <div class="card border-0 shadow-sm rounded-4 p-2">
                    <div class="card-body p-4 p-md-4">
                        <h4 class="fw-bold mb-4">Información de Soporte</h4>
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-telephone text-primary fs-5 me-3"></i>
                            <span class="text-dark">Línea directa: 800-3V-AYUDA</span>
                        </div>
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-envelope text-primary fs-5 me-3"></i>
                            <span class="text-dark">contacto.tiendas3v@gmail.com</span>
                        </div>
                        <div class="d-flex align-items-center mb-4">
                            <i class="bi bi-geo-alt text-primary fs-5 me-3"></i>
                            <span class="text-dark">Oficinas Insurgentes Sur 240, CDMX</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenedor de Notificacion / Alerta -->
        <div class="position-fixed bottom-0 start-50 translate-middle-x p-3 w-100 contenedor-alerta">
            <div id="alertaFormulario" class="alert d-none align-items-center border rounded-3 p-3 mb-0" role="alert">
                <i class="bi me-2 fs-5"></i>
                <div class="fw-semibold small"></div>
            </div>
        </div>
    </main>

    <footer class="footer-contacto" id="contacto">
        <div class="container">
            <div class="contenido-footer">
                <div class="item-footer">
                    <i class="bi bi-telephone-fill"></i>
                    <span>Llámanos: 800-3V-AYUDA (800-382-9832)</span>
                </div>
                <div class="item-footer">
                    <i class="bi bi-envelope-fill"></i>
                    <span>contacto.tiendas3v@gmail.com</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- JS Personalizado -->
    <script src="../js/config.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/contacto.js"></script>
     <script src="../js/navbar.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>
</body>

</html>
